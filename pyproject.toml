[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline-check"
version = "0.1.0"
description = "Every number in a paper recomputes from the repository's raw data: a recipe per number, checked at each edit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["latex", "papers", "research", "reproducibility", "agents", "claude-code"]

[project.scripts]
plumbline = "plumbline.cli:main"

[project.urls]
Homepage = "https://github.com/thanh-huy-nguyen/plumbline"

[tool.setuptools]
packages = ["plumbline"]
